name: Probe - refs API tag creation

# TEMPORARY DIAGNOSTIC (beadbox-gqk). Delete once the question is answered.
#
# QUESTION: promote cannot create the final tag when the tagged commit touches
# .github/workflows -- `git push` is rejected with "refusing to allow a GitHub
# App to create or update workflow ... without `workflows` permission".
# HYPOTHESIS: the check fires because a push TRANSFERS OBJECTS. The commit is
# already on the default branch, so a tag pointing at it publishes no new
# workflow content, and the refs API -- which creates a ref at an existing SHA
# without transferring anything -- may not trip it.
#
# This probe answers that with a CONTROLLED COMPARISON, in one run, with one
# token:
#   ARM A (control): git push a tag at that SHA. Expected to be REJECTED. If it
#                    somehow succeeds, this token has the permission and ARM B
#                    proves nothing -- which is exactly why the control is here.
#   ARM B (test)   : POST /git/refs at the same SHA.
# Both refs are deleted afterwards, always.
#
# The probe tags deliberately do NOT match v* so nothing else is triggered.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to tag. MUST touch .github/workflows or the result is meaningless."
        required: true
        default: "41d3af7250e297fdede70d4e8bfed671a6d77f7c"
        type: string

permissions:
  contents: write   # exactly what the promote job has

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBE_SHA: ${{ inputs.sha }}
      PUSH_TAG: probe-gqk-push
      API_TAG: probe-gqk-api
      UNPUB_TAG: probe-gqk-unpublished
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Precondition - the target commit must touch .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PROBE_SHA" --jq '.files[].filename')
          echo "Files in $PROBE_SHA:"; echo "$files" | sed 's/^/  /'
          if ! echo "$files" | grep -q '^\.github/workflows/'; then
            echo "::error::$PROBE_SHA does not touch .github/workflows; this probe would prove nothing."
            exit 1
          fi
          echo "OK: commit touches .github/workflows"

      - name: 'ARM A (control) - git push a tag at that SHA'
        id: arm_a
        continue-on-error: true    # rejection is the EXPECTED outcome here
        run: |
          set -uo pipefail
          git tag -f "$PUSH_TAG" "$PROBE_SHA"
          if git push origin "refs/tags/$PUSH_TAG" 2>&1 | tee /tmp/push.log; then
            echo "result=ACCEPTED" >> "$GITHUB_OUTPUT"
          else
            echo "result=REJECTED" >> "$GITHUB_OUTPUT"
          fi
          grep -qi 'workflows. permission\|workflow' /tmp/push.log \
            && echo "reason=workflow-permission" >> "$GITHUB_OUTPUT" \
            || echo "reason=other" >> "$GITHUB_OUTPUT"

      - name: 'ARM B (test) - POST /git/refs at the same SHA'
        id: arm_b
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if jq -n --arg ref "refs/tags/$API_TAG" --arg sha "$PROBE_SHA" '{ref:$ref, sha:$sha}' \
               | gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input - > /tmp/api.json 2>&1; then
            echo "result=CREATED" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          echo "--- response ---"; cat /tmp/api.json


      - name: 'ARM C (case B) - refs at a SHA whose workflow content is NOT published'
        # THE DISCRIMINATING CASE (shipper via QAM). Arm B tags a commit already
        # on the remote, so its workflow content is already published and the
        # permission check has nothing new to object to. That cannot tell an
        # EXEMPT api apart from one that simply never trips.
        # Here the object is built through the git data API -- blob, tree,
        # commit -- adding a workflow file that exists on NO ref. The content is
        # therefore unpublished. Then the same POST /git/refs is attempted.
        #   REFUSED here  => the api is NOT exempt; arm B succeeds because of HOW
        #                    we use it (tagging already-published content), which
        #                    is a property of our usage, not of the contract.
        #   CREATED here  => genuinely exempt; a release step may rest on it.
        id: arm_c
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          R="$GITHUB_REPOSITORY"
          fail() { echo "stage=$1" >> "$GITHUB_OUTPUT"; echo "result=BLOCKED_EARLY" >> "$GITHUB_OUTPUT"; exit 0; }

          BASE_SHA=$(gh api "repos/$R/git/ref/heads/main" --jq '.object.sha') || fail ref-read
          BASE_TREE=$(gh api "repos/$R/git/commits/$BASE_SHA" --jq '.tree.sha') || fail commit-read

          printf 'name: probe-unpublished\non: workflow_dispatch\njobs:\n  noop:\n    runs-on: ubuntu-latest\n    steps:\n      - run: "true"\n' > /tmp/wf.yml

          BLOB=$(jq -n --rawfile c /tmp/wf.yml '{content:$c, encoding:"utf-8"}' \
                 | gh api --method POST "repos/$R/git/blobs" --input - --jq '.sha') || fail blob
          echo "blob   $BLOB"

          TREE=$(jq -n --arg base "$BASE_TREE" --arg blob "$BLOB" \
                   '{base_tree:$base, tree:[{path:".github/workflows/probe-gqk-unpublished.yml", mode:"100644", type:"blob", sha:$blob}]}' \
                 | gh api --method POST "repos/$R/git/trees" --input - --jq '.sha') || fail tree
          echo "tree   $TREE"

          COMMIT=$(jq -n --arg t "$TREE" --arg p "$BASE_SHA" \
                     '{message:"probe: unpublished workflow content (beadbox-gqk)", tree:$t, parents:[$p]}' \
                   | gh api --method POST "repos/$R/git/commits" --input - --jq '.sha') || fail commit
          echo "commit $COMMIT  (on no ref)"
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"

          if jq -n --arg ref "refs/tags/$UNPUB_TAG" --arg sha "$COMMIT" '{ref:$ref, sha:$sha}' \
               | gh api --method POST "repos/$R/git/refs" --input - > /tmp/apic.json 2>&1; then
            echo "result=CREATED" >> "$GITHUB_OUTPUT"
          else
            echo "result=REFUSED" >> "$GITHUB_OUTPUT"
          fi
          echo "stage=refs" >> "$GITHUB_OUTPUT"
          echo "--- response ---"; cat /tmp/apic.json

      - name: Verdict
        run: |
          A="${{ steps.arm_a.outputs.result }}"; AR="${{ steps.arm_a.outputs.reason }}"
          B="${{ steps.arm_b.outputs.result }}"
          C="${{ steps.arm_c.outputs.result }}"; CS="${{ steps.arm_c.outputs.stage }}"
          {
            echo "## beadbox-gqk refs-API probe"
            echo ""
            echo "| arm | method | content already published? | result |"
            echo "|---|---|---|---|"
            echo "| A (control) | git push | yes | $A ($AR) |"
            echo "| B (case A) | POST /git/refs | yes | $B |"
            echo "| C (case B) | POST /git/refs | NO | $C (stage: $CS) |"
            echo ""
            if [ "$A" = "ACCEPTED" ]; then
              echo "**INCONCLUSIVE** - the control was accepted, so this token is not permission-limited and nothing else here proves anything."
            elif [ "$B" != "CREATED" ]; then
              echo "**HYPOTHESIS FAILS** - the refs API is blocked even for already-published content. Option (d) is the answer."
            elif [ "$C" = "CREATED" ]; then
              echo "**GENUINELY EXEMPT** - the refs API created a tag carrying UNPUBLISHED workflow content."
              echo "A release step may rest on the API contract itself. The fix is understood."
            elif [ "$C" = "REFUSED" ]; then
              echo "**WORKS, BUT BY OUR USAGE, NOT BY CONTRACT** - the API enforces the same check;"
              echo "arm B succeeds only because we tag content that is already published on the default"
              echo "branch. Option (c) is usable, but ONLY with that precondition stated and checked:"
              echo "the commit being tagged must already be reachable from a published ref. Build it"
              echo "with that caveat, or take option (d)."
            else
              echo "**CASE B INDETERMINATE** - blocked at stage '$CS' before the refs call."
              echo "That is itself informative: the data API refused to build unpublished workflow content."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cleanup - remove both probe refs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in "$PUSH_TAG" "$API_TAG" "$UNPUB_TAG"; do
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" >/dev/null 2>&1; then
              echo "deleted refs/tags/$t"
            else
              echo "refs/tags/$t not present (nothing to delete)"
            fi
          done
