name: Promote RC to Final Release

# Promotes validated RC artifacts to a final release without rebuilding.
# Downloads the exact binaries from an RC release and republishes them as the
# final version on both the origin repo and the public repo, then updates the
# Homebrew cask.
#
# Usage: gh workflow run promote-release.yml -f rc_tag=v0.7.0-rc.2

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "RC tag to promote (e.g., v0.7.0-rc.2)"
        required: true
        type: string
      skip_public:
        description: "Skip publishing to public repo"
        type: boolean
        default: false
      skip_homebrew:
        description: "Skip updating Homebrew cask"
        type: boolean
        default: false

# beadbox-l5i.1: read-only default; jobs that write opt in below.
permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      final_tag: ${{ steps.parse.outputs.final_tag }}
      version: ${{ steps.parse.outputs.version }}
      arm64_sha: ${{ steps.checksums.outputs.arm64_sha }}
      darwin_bundle_sha: ${{ steps.checksums.outputs.darwin_bundle_sha }}
      linux_bundle_sha: ${{ steps.checksums.outputs.linux_bundle_sha }}

    steps:
      - name: Parse RC tag
        id: parse
        env:
          # Via env:, not ${{ }} inline — a dispatch input interpolated into a
          # run: block is expanded by the runner before bash sees it, so its
          # contents would execute as shell (zizmor template-injection). The
          # format check below then constrains it to vX.Y.Z-rc.N.
          INPUT_RC_TAG: ${{ inputs.rc_tag }}
        run: |
          RC_TAG="${INPUT_RC_TAG}"

          # Validate format: must be vX.Y.Z-rc.N
          if [[ ! "$RC_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::Invalid RC tag format: $RC_TAG (expected vX.Y.Z-rc.N)"
            exit 1
          fi

          # Derive final tag by stripping -rc.N
          FINAL_TAG="${RC_TAG%%-rc.*}"
          VERSION="${FINAL_TAG#v}"

          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "final_tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Promoting $RC_TAG -> $FINAL_TAG (version $VERSION)"

      # Checkout BEFORE downloading artifacts. actions/checkout defaults to
      # clean: true which runs git clean -ffdx, wiping any previously
      # downloaded files in the workspace.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download RC artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          RC_TAG="${{ steps.parse.outputs.rc_tag }}"

          echo "Downloading artifacts from $RC_TAG..."
          # The updater bundles and their signatures are release artifacts too.
          # Without them the promoted release has no manifest, the updater
          # endpoint 404s, and a 404 reads to the client as "no update
          # available" -- the update path dies silently (beadbox-l5i.6.4).
          # NB "*.deb" already matched Beadbox_x86_64.deb before this change, so
          # that one bundle was reaching the workspace and still never being
          # uploaded; the .sig files and the macOS bundle were not arriving at all.
          # latest.json is deliberately NOT downloaded: it is regenerated for the
          # final tag below, and a copy that never enters the workspace cannot be
          # uploaded by accident.
          gh release download "$RC_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.dmg" --pattern "*.deb" --pattern "*.exe" \
            --pattern "*.app.tar.gz" --pattern "*.sig" --pattern "*.nsis.zip" \
            --clobber

          echo ""
          echo "Downloaded artifacts:"
          ls -la

          # Artifacts are validated by NAME, split into required and optional.
          # Deliberately not a count: "any two of three" would happily promote a
          # release missing macOS as long as some other pair turned up.
          #
          # Windows is optional because its signing credentials are not yet
          # provisioned (beadbox-l5i.6.1), so the transition release ships two
          # platforms. When Windows returns it is validated again automatically,
          # and can also be added to an existing release as a later asset.
          # macOS x64 is disabled; AppImage was dropped in v0.25 per bb-ak1x.
          # The updater bundle + .sig for each shipping platform is REQUIRED for
          # the same reason the installer is: without them the promoted release
          # cannot carry a valid manifest, and self-update is silently dead.
          REQUIRED=(
            "Beadbox-${VERSION}-macOS-arm64.dmg"
            "beadbox_${VERSION}_Linux_amd64.deb"
            "Beadbox_aarch64.app.tar.gz"
            "Beadbox_aarch64.app.tar.gz.sig"
            "Beadbox_x86_64.deb"
            "Beadbox_x86_64.deb.sig"
          )
          OPTIONAL=(
            "Beadbox-${VERSION}-Windows-x64-setup.exe"
            "Beadbox_x86_64.nsis.zip"
            "Beadbox_x86_64.nsis.zip.sig"
          )

          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required artifact: $f"
              MISSING=1
            else
              echo "Found (required): $f ($(stat -c%s "$f" 2>/dev/null || stat -f%z "$f") bytes)"
            fi
          done

          for f in "${OPTIONAL[@]}"; do
            if [ -f "$f" ]; then
              echo "Found (optional): $f ($(stat -c%s "$f" 2>/dev/null || stat -f%z "$f") bytes)"
            else
              echo "Absent (optional, not an error): $f"
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::RC release is incomplete: a REQUIRED artifact is missing. Promotion aborted."
            exit 1
          fi

      - name: Compute checksums
        id: checksums
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          echo "SHA256 checksums:"
          sha256sum Beadbox-* beadbox_*

          ARM64_SHA=$(sha256sum "Beadbox-${VERSION}-macOS-arm64.dmg" | cut -d' ' -f1)
          echo "arm64_sha=$ARM64_SHA" >> "$GITHUB_OUTPUT"

          # The updater signatures cover bundle CONTENTS, so carrying the bundles
          # forward byte-for-byte is what keeps them valid across regeneration of
          # latest.json. Checksum them here and re-check after the round trip;
          # bytes that change in transit would break verification silently, on
          # the user's machine, at update time.
          echo "darwin_bundle_sha=$(sha256sum Beadbox_aarch64.app.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_bundle_sha=$(sha256sum Beadbox_x86_64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create final tag
        run: |
          RC_TAG="${{ steps.parse.outputs.rc_tag }}"
          FINAL_TAG="${{ steps.parse.outputs.final_tag }}"

          # Point the final tag at the same commit as the RC tag
          RC_COMMIT=$(git rev-list -n 1 "$RC_TAG")
          echo "RC commit: $RC_COMMIT"

          if git rev-parse "$FINAL_TAG" >/dev/null 2>&1; then
            EXISTING_COMMIT=$(git rev-list -n 1 "$FINAL_TAG")
            if [ "$EXISTING_COMMIT" = "$RC_COMMIT" ]; then
              echo "Tag $FINAL_TAG already exists at the correct commit"
            else
              echo "::warning::Tag $FINAL_TAG exists at $EXISTING_COMMIT but RC is at $RC_COMMIT. Updating tag."
              git tag -f "$FINAL_TAG" "$RC_COMMIT"
              git push origin "$FINAL_TAG" --force
            fi
          else
            echo "Creating tag $FINAL_TAG at $RC_COMMIT"
            git tag "$FINAL_TAG" "$RC_COMMIT"
            git push origin "$FINAL_TAG"
          fi

      - name: Create final release on private repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          FINAL_TAG="${{ steps.parse.outputs.final_tag }}"
          RC_TAG="${{ steps.parse.outputs.rc_tag }}"

          # Delete existing final release if present (from a previous failed attempt or rebuild)
          gh release delete "$FINAL_TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true

          # Same required/optional split as the validation step: attach Windows
          # only if it was actually built, otherwise gh fails on a missing file.
          ASSETS=(
            "Beadbox-${VERSION}-macOS-arm64.dmg"
            "beadbox_${VERSION}_Linux_amd64.deb"
            "Beadbox_aarch64.app.tar.gz"
            "Beadbox_aarch64.app.tar.gz.sig"
            "Beadbox_x86_64.deb"
            "Beadbox_x86_64.deb.sig"
          )
          [ -f "Beadbox-${VERSION}-Windows-x64-setup.exe" ] && ASSETS+=("Beadbox-${VERSION}-Windows-x64-setup.exe")
          [ -f "Beadbox_x86_64.nsis.zip" ] && ASSETS+=("Beadbox_x86_64.nsis.zip" "Beadbox_x86_64.nsis.zip.sig")

          gh release create "$FINAL_TAG" \
            "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --title "$FINAL_TAG" \
            --notes "Release ${VERSION} (promoted from ${RC_TAG})"

          echo "Created release $FINAL_TAG on private repo"

      - name: Trigger website deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering website deploy for ${{ steps.parse.outputs.final_tag }}..."
          gh workflow run deploy-website.yml --repo "${{ github.repository }}"

  publish-public:
    # Same-repo writes only: creating the release, publishing the notes file and
    # updating the release body all target THIS repository, so the built-in
    # GITHUB_TOKEN suffices. It is repo-scoped and expires with the run, which a
    # PAT is not and does not. The workflow default is contents: read, so the
    # write is granted here and nowhere else.
    permissions:
      contents: write
    # beadbox-l5i.6.1: signing secrets are scoped to the `release` environment,
    # whose ref policy allows only v* tags and main. A job must declare the
    # environment to read them, and a fork PR's head ref matches neither, so a
    # fork-triggered run cannot reach these secrets even if it reaches this job.
    environment: release
    if: ${{ !inputs.skip_public }}
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download artifacts from final release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Updater bundles + signatures ride along (beadbox-l5i.6.4). As in the
          # promote job, latest.json is deliberately not fetched: it is
          # regenerated for this tag further down.
          gh release download "${{ needs.promote.outputs.final_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.dmg" --pattern "*.deb" --pattern "*.exe" \
            --pattern "*.app.tar.gz" --pattern "*.sig" --pattern "*.nsis.zip" \
            --clobber

      - name: Verify checksums match
        run: |
          VERSION="${{ needs.promote.outputs.version }}"
          ARM64_SHA=$(sha256sum "Beadbox-${VERSION}-macOS-arm64.dmg" | cut -d' ' -f1)

          if [ "$ARM64_SHA" != "${{ needs.promote.outputs.arm64_sha }}" ]; then
            echo "::error::arm64 DMG checksum mismatch after re-download!"
            exit 1
          fi

          # The updater signatures sign bundle CONTENTS. If these bytes differ by
          # so much as one, the signature stops verifying -- and it fails on the
          # user's machine at update time, not here. Check them explicitly.
          DARWIN_SHA=$(sha256sum "Beadbox_aarch64.app.tar.gz" | cut -d' ' -f1)
          if [ "$DARWIN_SHA" != "${{ needs.promote.outputs.darwin_bundle_sha }}" ]; then
            echo "::error::darwin updater bundle checksum mismatch after re-download; its signature would no longer verify"
            exit 1
          fi
          LINUX_SHA=$(sha256sum "Beadbox_x86_64.deb" | cut -d' ' -f1)
          if [ "$LINUX_SHA" != "${{ needs.promote.outputs.linux_bundle_sha }}" ]; then
            echo "::error::linux updater bundle checksum mismatch after re-download; its signature would no longer verify"
            exit 1
          fi
          echo "Checksums verified: installers AND updater bundles are byte-identical"

      - name: Publish to public repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.promote.outputs.final_tag }}"
          VERSION="${{ needs.promote.outputs.version }}"

          gh release delete "$TAG" --repo beadbox/beadbox --yes 2>/dev/null || true

          WINDOWS_EXE="Beadbox-${VERSION}-Windows-x64-setup.exe"

          ASSETS=(
            "Beadbox-${VERSION}-macOS-arm64.dmg"
            "beadbox_${VERSION}_Linux_amd64.deb"
            "Beadbox_aarch64.app.tar.gz"
            "Beadbox_aarch64.app.tar.gz.sig"
            "Beadbox_x86_64.deb"
            "Beadbox_x86_64.deb.sig"
          )
          [ -f "$WINDOWS_EXE" ] && ASSETS+=("$WINDOWS_EXE")
          [ -f "Beadbox_x86_64.nsis.zip" ] && ASSETS+=("Beadbox_x86_64.nsis.zip" "Beadbox_x86_64.nsis.zip.sig")

          # The release body is built to match the assets actually attached.
          # Listing a Windows installer that was not built would put a download
          # link on the public release page that 404s for anyone who clicks it.
          NOTES_FILE="$(mktemp)"
          {
            echo "## Beadbox $TAG"
            echo ""
            echo "**macOS** (Apple Silicon, signed and notarized):"
            echo "- **Apple Silicon (M1/M2/M3/M4):** Beadbox-${VERSION}-macOS-arm64.dmg"
            echo ""
            if [ -f "$WINDOWS_EXE" ]; then
              echo "**Windows** (x64, signed):"
              echo "- **Installer:** ${WINDOWS_EXE}"
              echo ""
            fi
            echo "**Linux** (x86_64):"
            echo "- Debian: beadbox_${VERSION}_Linux_amd64.deb"
            echo ""
            echo "Visit [beadbox.app](https://beadbox.app) for install options."
          } > "$NOTES_FILE"

          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --repo beadbox/beadbox \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"

      - name: Publish PM-authored release notes to public repo
        # beadbox-l5i.9 / pm/systemdesign.md §6.2 (release-notes pipeline,
        # Nelson-ruled 2026-08-21; supersedes the old extraction step).
        #
        # Source : release-notes/<TAG>.md, top level of the PRIVATE repo,
        #          filename matching the tag exactly including the leading v.
        #          PM owns the whole file INCLUDING its heading.
        # Artifact: beadbox/beadbox : changelog/<TAG>.md. This exact path is
        #          load-bearing — the in-app update dialog reads it.
        #
        # Published VERBATIM: no awk extraction, no synthesised heading, no
        # transformation of any kind. The previous version regex-sliced a
        # section out of the private internal changelog, which is precisely
        # how internal prose reaches a public repo. Nothing here reinterprets
        # release copy.
        #
        # NB the private changelog filename is deliberately not spelled out
        # anywhere in this file: this workflow ships in the public snapshot,
        # and publish-snapshot.sh's dangling-reference report greps shipped
        # files for the literal name of excluded paths.
        env:
          PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_REPO: ${{ github.repository }}
          TAG: ${{ needs.promote.outputs.final_tag }}
        run: |
          set -euo pipefail
          SRC="release-notes/${TAG}.md"
          DEST="changelog/${TAG}.md"

          # Fail loud on a missing source. Previously a missing/unmatched
          # section only warned and exited 0, so a release could ship with an
          # empty in-app changelog and nobody would notice. Per §6.2 a missing
          # file now BLOCKS promotion.
          if ! GH_TOKEN="$PRIVATE_TOKEN" gh api \
                 "repos/${PRIVATE_REPO}/contents/${SRC}" \
                 --jq '.content' > /tmp/notes.b64 2>/tmp/notes.err; then
            echo "::error::Release notes not found at ${SRC} in ${PRIVATE_REPO}."
            echo "::error::PM authors this file per pm/systemdesign.md 6.2; it must exist before promotion."
            sed 's/^/  /' /tmp/notes.err || true
            exit 1
          fi

          tr -d '\n' < /tmp/notes.b64 | base64 -d > /tmp/changelog-version.md

          if [ ! -s /tmp/changelog-version.md ]; then
            echo "::error::${SRC} exists but is empty — refusing to publish an empty changelog."
            exit 1
          fi

          echo "Publishing ${SRC} verbatim to ${DEST}:"
          cat /tmp/changelog-version.md

          FILE_CONTENT=$(base64 -w0 /tmp/changelog-version.md)

          # Existing file needs its SHA to update.
          CURRENT_SHA=$(GH_TOKEN="$PUBLIC_TOKEN" gh api \
            "repos/beadbox/beadbox/contents/${DEST}" --jq '.sha' 2>/dev/null || echo "")

          if [ -n "$CURRENT_SHA" ]; then
            GH_TOKEN="$PUBLIC_TOKEN" gh api "repos/beadbox/beadbox/contents/${DEST}" \
              -X PUT \
              -f message="docs: add changelog for ${TAG}" \
              -f content="$FILE_CONTENT" \
              -f sha="$CURRENT_SHA"
          else
            GH_TOKEN="$PUBLIC_TOKEN" gh api "repos/beadbox/beadbox/contents/${DEST}" \
              -X PUT \
              -f message="docs: add changelog for ${TAG}" \
              -f content="$FILE_CONTENT"
          fi

          echo "Created ${DEST} in beadbox/beadbox"

      - name: Update public repo release body with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.promote.outputs.final_tag }}"

          # Use the changelog file we just generated
          if [ ! -f /tmp/changelog-version.md ]; then
            echo "::warning::No changelog file generated, skipping release body update"
            exit 0
          fi

          NOTES=$(cat /tmp/changelog-version.md)
          gh release edit "$TAG" \
            --repo beadbox/beadbox \
            --notes "$NOTES"

          echo "Updated release body for $TAG on beadbox/beadbox"

      - name: Regenerate latest.json for the final tag
        # beadbox-l5i.6.4. Without this the promoted release has no manifest at
        # all: the updater endpoint (.../releases/latest/download/latest.json)
        # 404s, and a 404 is indistinguishable from "no update available" to the
        # client -- self-update dies silently while the notes promise otherwise.
        #
        # REGENERATED, never copied. The RC's latest.json carries version
        # "<x>-rc.N" and urls under the PRERELEASE tag, which is routinely
        # deleted after promotion; copying it would advertise an RC version from
        # urls that 404.
        #
        # Regeneration is safe because a minisign signature covers the bundle
        # CONTENTS -- not the url, not the version, not the filename. Confirmed
        # two ways rather than assumed: tauri-plugin-updater 2.10.1 verifies the
        # streamed download buffer (verify_signature(&buffer, ...) ->
        # public_key.verify(data, ...), url used only to fetch), and the rc.1
        # bundles verify against this app's own pubkey from bundle bytes alone --
        # including through the rename, since the signatures' trusted comments
        # still name the original bundler filenames.
        # The bundles are copied byte-for-byte and never rebuilt, which is the
        # precondition that keeps those signatures valid; the checksum step above
        # is what enforces it.
        #
        # Runs after the release body is set from PM's changelog so `notes`
        # carries the real changelog rather than a placeholder.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.promote.outputs.final_tag }}
          VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          REPO="beadbox/beadbox"
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body')
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          platforms_json=""
          add_platform() {
            key="$1"; bundle="$2"; required="$3"
            if [ ! -f "$bundle" ] || [ ! -f "${bundle}.sig" ]; then
              if [ "$required" = "required" ]; then
                echo "::error::missing $bundle or ${bundle}.sig -- the release would ship a manifest with no $key entry, and every $key user's update check would fail for the life of this release"
                return 1
              fi
              echo "Absent (optional): $bundle -- $key omitted from the manifest"
              return 0
            fi
            sig=$(cat "${bundle}.sig")
            url="https://github.com/${REPO}/releases/download/${TAG}/${bundle}"
            entry=$(jq -n --arg sig "$sig" --arg url "$url" '{signature:$sig, url:$url}')
            platforms_json="${platforms_json}\"${key}\":${entry},"
            echo "  $key -> $bundle"
          }

          add_platform "darwin-aarch64" "Beadbox_aarch64.app.tar.gz" required
          add_platform "linux-x86_64"   "Beadbox_x86_64.deb"         required
          add_platform "windows-x86_64" "Beadbox_x86_64.nsis.zip"    optional

          platforms_json="${platforms_json%,}"
          if [ -z "$platforms_json" ]; then
            echo "::error::no platforms resolved; latest.json would be empty"
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "{${platforms_json}}" \
            '{version:$version, notes:$notes, pub_date:$pub_date, platforms:$platforms}' \
            > "$WORK/latest.json"

          # Assert the two things a verbatim copy would have got wrong. These are
          # the whole point of regenerating, so they are checked, not assumed.
          jq -e --arg v "$VERSION" '.version == $v' "$WORK/latest.json" >/dev/null \
            || { echo "::error::latest.json version is not $VERSION"; exit 1; }
          jq -e --arg t "$TAG" 'all(.platforms[].url; contains("/download/" + $t + "/"))' "$WORK/latest.json" >/dev/null \
            || { echo "::error::a platform url does not point at $TAG"; exit 1; }

          jq '.notes = (.notes | .[0:60] + "...")' "$WORK/latest.json"

          gh release upload "$TAG" "$WORK/latest.json" --clobber --repo "$REPO"
          echo "Published latest.json for $TAG"

  publish-homebrew:
    # Deliberately NOT contents: write. This job pushes to a DIFFERENT repository
    # (beadbox/homebrew-cask) using CASK_PAT, which is the only credential here
    # scoped beyond this repo. It needs no write access to this one, and giving it
    # any would blur the separation that keeps a cross-repo token off the
    # same-repo steps.
    permissions:
      contents: read
    # beadbox-l5i.6.1: signing secrets are scoped to the `release` environment,
    # whose ref policy allows only v* tags and main. A job must declare the
    # environment to read them, and a fork PR's head ref matches neither, so a
    # fork-triggered run cannot reach these secrets even if it reaches this job.
    environment: release
    if: ${{ !inputs.skip_homebrew && !inputs.skip_public }}
    needs: [promote, publish-public]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download DMGs from final release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.promote.outputs.final_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.dmg" \
            --clobber

      - name: Verify checksums match
        run: |
          VERSION="${{ needs.promote.outputs.version }}"
          ARM64_SHA=$(sha256sum "Beadbox-${VERSION}-macOS-arm64.dmg" | cut -d' ' -f1)

          if [ "$ARM64_SHA" != "${{ needs.promote.outputs.arm64_sha }}" ]; then
            echo "::error::arm64 DMG checksum mismatch!"
            exit 1
          fi
          echo "Checksums verified"

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.CASK_PAT }}
        run: |
          VERSION="${{ needs.promote.outputs.version }}"
          ARM64_SHA="${{ needs.promote.outputs.arm64_sha }}"

          rm -rf /tmp/cask
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/beadbox/homebrew-cask.git" /tmp/cask

          cat > /tmp/cask/Casks/beadbox.rb << CASK_EOF
          cask "beadbox" do
            version "${VERSION}"

            arch arm: "arm64"

            sha256 "${ARM64_SHA}"
            url "https://github.com/beadbox/beadbox/releases/download/v#{version}/Beadbox-#{version}-macOS-arm64.dmg"

            name "Beadbox"
            desc "Desktop app for the beads issue tracker"
            homepage "https://github.com/beadbox/beadbox"

            depends_on macos: ">= :ventura"

            app "Beadbox.app"

            zap trash: [
              "~/Library/Application Support/com.nmelo.beadbox",
              "~/Library/Caches/com.nmelo.beadbox",
              "~/Library/Preferences/com.nmelo.beadbox.plist",
              "~/Library/Application Support/com.nmelo.beads-ui",
              "~/Library/Caches/com.nmelo.beads-ui",
              "~/Library/Preferences/com.nmelo.beads-ui.plist",
            ]
          end
          CASK_EOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/cask/Casks/beadbox.rb

          cd /tmp/cask
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
